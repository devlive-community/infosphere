name: Release

# 推送 v* 标签：构建发布产物并创建 GitHub Release，供在线升级消费
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NODE_VERSION: "24.20.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── 前端 ──
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml

      - name: Build web (SSR standalone)
        working-directory: app/web
        env:
          NEXT_DIST_DIR: .next-build
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test
          pnpm build

      # ── 单文件（每个架构嵌入匹配的 Node.js + 同一份 Next.js） ──
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test backend
        run: |
          deploy/package-web-runtime.sh "$NODE_VERSION" linux amd64 server/internal/webbundle/assets/web-runtime.tar.gz
          cd server
          go test ./...

      - name: Build backend binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p release
          LDFLAGS="-s -w \
            -X 'infosphere/server/internal/app.Version=${VERSION}' \
            -X 'infosphere/server/internal/app.Commit=${GITHUB_SHA::7}' \
            -X 'infosphere/server/internal/app.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          for arch in amd64 arm64; do
            deploy/package-web-runtime.sh "$NODE_VERSION" linux "$arch" server/internal/webbundle/assets/web-runtime.tar.gz
            GOOS=linux GOARCH=$arch go -C server build -trimpath -ldflags "$LDFLAGS" \
              -o ../release/infosphere-server-linux-$arch .
          done

      - name: Generate checksums
        working-directory: release
        run: sha256sum infosphere-server-linux-* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/infosphere-server-linux-amd64
            release/infosphere-server-linux-arm64
            release/SHA256SUMS.txt
