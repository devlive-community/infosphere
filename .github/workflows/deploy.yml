name: Deploy to Production

# push 到 dev 分支（或手动触发）：构建 → 上传 → 原子切换 → 健康检查
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.20.0"

concurrency:
  group: knowforge-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      # ── 前端：类型检查 + lint + SSR 构建 ──
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: app/web
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and lint web
        working-directory: app/web
        run: |
          pnpm exec tsc --noEmit
          pnpm test
          pnpm exec next lint

      - name: Build web (SSR standalone)
        working-directory: app/web
        env:
          NEXT_DIST_DIR: .next-build
        run: pnpm build

      - name: Package embedded web runtime
        run: deploy/package-web-runtime.sh "$NODE_VERSION" linux amd64 server/internal/webbundle/assets/web-runtime.tar.gz

      # ── 单文件：Go API + Next.js standalone + Node.js 24 ──
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet and test backend
        working-directory: server
        run: |
          go vet ./...
          go test ./...

      - name: Build Linux backend
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p ../release
          go build -trimpath \
            -ldflags="-s -w \
              -X 'knowforge/server/internal/app.Commit=${COMMIT_SHA::7}' \
              -X 'knowforge/server/internal/app.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o ../release/knowforge-server .

      # ── 打包发布：只有一个应用二进制 + systemd unit + env ──
      - name: Assemble release
        env:
          KNOWFORGE_ENV_FILE: ${{ secrets.KNOWFORGE_ENV_FILE }}
        run: |
          test -n "$KNOWFORGE_ENV_FILE"
          cp deploy/knowforge-api.service deploy/knowforge.sudoers release/
          printf '%s\n' "$KNOWFORGE_ENV_FILE" > release/knowforge.env
          chmod 600 release/knowforge.env
          (cd release && sha256sum knowforge-server > SHA256SUMS)
          ls -la release/

      - name: Upload release to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_PRIVATE_HOST }}
          username: ${{ secrets.SSH_PRIVATE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "release/*"
          target: "/tmp/knowforge-release-${{ github.sha }}"
          strip_components: 1

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_PRIVATE_HOST }}
          username: ${{ secrets.SSH_PRIVATE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RELEASE_SHA
          script: |
            set -eu
            deploy_root=/var/www/knowforge
            staged_dir=/tmp/knowforge-release-$RELEASE_SHA
            release_dir=$deploy_root/releases/$RELEASE_SHA

            test -f "$staged_dir/knowforge-server"
            test -s "$staged_dir/knowforge.env"

            # 目录骨架
            sudo install -d -m 755 "$deploy_root/releases" "$release_dir" /etc/knowforge
            sudo install -d -m 755 -o www-data -g www-data /var/lib/knowforge /var/lib/knowforge/uploads
            sudo install -d -m 755 -o www-data -g www-data /var/www/knowforge/static

            # 从旧品牌 infosphere 迁移数据：仅当旧数据目录存在、且新目录还没有 config.json（即尚未迁移）时，
            # 整体拷贝旧数据（含 sqlite、config.json、uploads）到新目录，避免改名后丢历史数据或写入只读旧路径。
            if [ -d /var/lib/infosphere ] && [ ! -e /var/lib/knowforge/config.json ]; then
              echo "检测到旧数据目录 /var/lib/infosphere，迁移到 /var/lib/knowforge …"
              sudo cp -a /var/lib/infosphere/. /var/lib/knowforge/
              sudo chown -R www-data:www-data /var/lib/knowforge
            fi

            # 发布单文件
            sudo cp -a "$staged_dir/." "$release_dir/"
            sudo chmod 755 "$release_dir/knowforge-server"

            # 配置与服务
            sudo install -m 600 "$release_dir/knowforge.env" /etc/knowforge/knowforge.env
            sudo install -m 644 "$release_dir/knowforge-api.service" /etc/systemd/system/knowforge-api.service
            sudo install -m 440 "$release_dir/knowforge.sudoers" /etc/sudoers.d/knowforge
            sudo visudo -c >/dev/null

            # 原子切换 current
            sudo ln -sfn "$release_dir" "$deploy_root/current.next"
            sudo mv -Tf "$deploy_root/current.next" "$deploy_root/current"

            # 停止并禁用旧品牌单元（infosphere-*）与早期独立 Web unit，避免端口 6969/6900 冲突与残留
            sudo systemctl disable --now infosphere-api.service infosphere-web.service knowforge-web.service 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl enable knowforge-api.service
            sudo systemctl restart knowforge-api.service

            # 健康检查：单服务包含当前 commit，内嵌 Web 与 Go 页面代理均可访问
            attempt=0
            until curl -fsS http://127.0.0.1:6969/api/v1/health | grep -q "\"commit\":\"${RELEASE_SHA::7}\"" \
              && curl -fsS -o /dev/null http://127.0.0.1:6900/ \
              && curl -fsS -o /dev/null http://127.0.0.1:6969/; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 15 ]; then
                sudo systemctl status knowforge-api.service --no-pager || true
                sudo journalctl -u knowforge-api.service -n 30 --no-pager || true
                exit 1
              fi
              sleep 2
            done

            # 清理：仅保留最近 5 个版本
            sudo bash -c "ls -1dt $deploy_root/releases/*/ | tail -n +6 | xargs -r rm -rf"
            rm -rf "$staged_dir"
            echo "KnowForge 部署完成: $release_dir"
